name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 静的解析とテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      # package-lock.json どおりに入れる。lock が古ければここで失敗する。
      - run: npm ci

      - name: 整形の確認
        run: npm run format:check

      - name: lint（type-aware）
        run: npm run lint

      # type-aware lint は型エラーを検出しないため、型検査は別に走らせる。
      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

  build:
    name: ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # ビルド時に .dev.vars が dist/ へコピーされ、preview はそちらを読む。
      # そのため、ビルドより前に用意しておく必要がある。
      - name: プレビュー用のダミー OAuth 設定を用意
        env:
          BACKLOG_CLIENT_ID: ci-dummy-client-id
          BACKLOG_CLIENT_SECRET: ci-dummy-client-secret
        run: |
          printf 'BACKLOG_CLIENT_ID=%s\nBACKLOG_CLIENT_SECRET=%s\n' \
            "$BACKLOG_CLIENT_ID" "$BACKLOG_CLIENT_SECRET" > .dev.vars

      - name: ビルド
        run: npm run build

      # 実際に起動して、ログイン前に確認できる範囲のスモークテストを流す。
      - name: スモークテスト
        run: |
          # host を明示しないと IPv6 だけに bind され、127.0.0.1 へ届かないことがある。
          npx vite preview --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'プレビューサーバーが起動しませんでした'
            echo '--- preview.log ---'
            cat preview.log
            exit 1
          fi
          node scripts/smoke.mjs http://127.0.0.1:4173 || {
            echo '--- preview.log ---'
            cat preview.log
            exit 1
          }
