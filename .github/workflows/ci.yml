name: CI

# GitHub Flow: main への push と、main へ向けたすべての PR で回す。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 静的解析とテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # packageManager に sha512 ハッシュを書いてあるため、corepack が
      # pnpm 本体の完全性を検証したうえで取得する。
      - name: corepack を有効化
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      # pnpm-lock.yaml どおりに入れる。lock が古ければここで失敗する。
      - run: pnpm install --frozen-lockfile

      - name: 整形の確認
        run: pnpm run format:check

      - name: lint（type-aware）
        run: pnpm run lint

      - name: CSS の lint
        run: pnpm run lint:css

      - name: Markdown の lint
        run: pnpm run lint:md

      - name: GitHub Actions の lint
        run: pnpm run lint:actions

      - name: スペルチェック
        run: pnpm run spellcheck

      # type-aware lint は型エラーを検出しないため、型検査は別に走らせる。
      - name: 型チェック
        run: pnpm run typecheck

      - name: テスト
        run: pnpm test

  build:
    name: ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: corepack を有効化
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Apps Script へ push できる形（gas-dist/）を組み立てる。
      - name: ビルド
        run: pnpm run build

      # Web アプリは実際にデプロイしないと動かせないため、
      # 成果物が「push すれば動く形」になっているかを検査する。
      - name: 成果物の検査
        run: pnpm run smoke
