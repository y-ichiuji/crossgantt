name: Deploy

# GitHub Flow: main が常にデプロイ可能な状態。main への push で本番へ反映する。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: デプロイ前の検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: corepack を有効化
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  deploy:
    name: Cloudflare Workers へデプロイ
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://crossgantt.y-ichiuji.workers.dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: corepack を有効化
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # wrangler の汎用エラーより先に、何が足りないかを明示する。
      - name: シークレットの確認
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=''
          [ -n "$API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::リポジトリシークレットが未設定です:$missing（設定方法は README の CI / CD を参照）"
            exit 1
          fi

      - name: デプロイ
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # ビルド済みの成果物をそのまま上げる。
          command: deploy

      # 公開直後に、ログイン前でも確認できる範囲を検証する。
      - name: 公開後のスモークテスト
        run: node scripts/smoke.mjs https://crossgantt.y-ichiuji.workers.dev
